# PostgreSQL для EventApi — совпадает с ConnectionStrings:DefaultConnection в appsettings.json
# Запуск из корня репозитория: docker compose up -d
# Остановка: docker compose down
# Данные сохраняются в именованном томе eventapi_pgdata

services:
  bookingservice-db:
    image: postgres:16-alpine
    container_name: bookingservice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookingservice
    ports:
      - "5433:5432"
    volumes:
      - bookingservice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingservice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookingservice_pgdata:
