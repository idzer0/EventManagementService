# PostgreSQL для EventApi — совпадает с ConnectionStrings:DefaultConnection в appsettings.json
# Запуск из корня репозитория: docker compose up -d
# Остановка: docker compose down
# Данные сохраняются в именованном томе eventapi_pgdata

services:
  eventservice-db:
    image: postgres:16-alpine
    container_name: eventservice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventservice
    ports:
      - "5434:5432"
    volumes:
      - eventservice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventservice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eventservice_pgdata:
